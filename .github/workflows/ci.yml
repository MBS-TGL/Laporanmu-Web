name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b --force
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Lint (non-blocking, utang lama)
        run: npm run lint
        continue-on-error: true
